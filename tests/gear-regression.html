<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Gear Regression Matrix</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 8px; }
        .note { color: #64748b; margin-bottom: 20px; }
        #summary {
            padding: 12px 14px;
            border-radius: 10px;
            background: #e2e8f0;
            font-weight: 700;
            margin-bottom: 16px;
        }
        #summary.pass { background: #dcfce7; color: #166534; }
        #summary.fail { background: #fee2e2; color: #991b1b; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 9px 11px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }
        th { background: #f1f5f9; }
        tr:last-child td { border-bottom: 0; }
        .ok { color: #15803d; font-weight: 800; }
        .bad { color: #b91c1c; font-weight: 800; }
        code { font-size: 0.85em; }
    </style>
</head>
<body>
    <main>
        <h1>LEGO Gear Regression Matrix</h1>
        <p class="note">
            Browser-level regression tests for placement geometry, tooth phase, axle state,
            pre-commit ratio-cycle rejection, conflict marking, and gear-pair consistency.
            The suite runs automatically when this page opens.
        </p>
        <div id="summary">Running…</div>
        <table>
            <thead>
                <tr><th>Status</th><th>Test</th><th>Details</th></tr>
            </thead>
            <tbody id="results"></tbody>
        </table>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/simulation.js"></script>
    <script src="./gear-regression.test.js"></script>
</body>
</html>
